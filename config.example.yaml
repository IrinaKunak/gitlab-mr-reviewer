# Optional structured config (CONFIG_FILE, default ./config.yaml). Everything
# here can also come from env; env vars from .env WIN over this file.
# Secrets stay in .env: reference them as ${NAME} or ${NAME:-default}.
# Unknown keys or tiers are a startup error, not a silent no-op.
# Check the effective result before deploying:
#   docker compose run --rm --no-deps gitlab-mr-reviewer python -m reviewer.config

gitlab:
  # Replaces GITLAB_URL[_N] / GITLAB_TOKEN[_N] / XGITLABTOKEN[_N] (deprecated).
  # Keep the names the env layout gave them ("primary", "instance_2", ...):
  # the name is part of the incremental-review state key, a new name means one
  # full re-review per open MR.
  instances:
    - name: primary
      url: https://lab.smysl.pro
      token: ${GITLAB_TOKEN}
      webhook_token: ${XGITLABTOKEN}
    - name: instance_2
      url: https://lab.catzwolf.ru
      token: ${GITLAB_TOKEN_2}
      webhook_token: ${XGITLABTOKEN_2}

notify:
  telegram:
    # replaces TELEGRAM_CHAT_ID / TELEGRAM_CHAT_ID_1..10 (deprecated);
    # env alternative: TELEGRAM_CHAT_IDS=-100123,-100456
    chat_ids: ["-100123456789"]
    # tester reports besides the bridge chat; empty = chat_ids
    tester_report_chat_ids: []

llm:
  # tiers: only what differs from the defaults (a model alone keeps the
  # tier's default OpenRouter fallback chain); allowed tiers: fast, main, smart
  # tiers:
  #   smart:
  #     model: claude-opus-5
  #     fallback: [anthropic/claude-opus-5, openai/gpt-5.6-terra, moonshotai/kimi-k3]
  # capabilities + price per model id (prefix); entries override/extend the
  # built-in table (config.DEFAULT_MODELS) — a new model is an entry, not a release
  # models:
  #   claude-sonnet-6: {thinking_off: between_tools, price: [3, 15]}
  # $/MTok (input, output) on top of the table's prices (env: MODEL_PRICES)
  prices:
    claude-sonnet-5: [3, 15]
