services:
  gitlab-mr-reviewer:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    # All configuration comes from the mounted .env (+ optional config.yaml),
    # read and validated by reviewer/config.py. There is deliberately no
    # `environment:` block: its ${VAR:-default}s used to override the code's
    # defaults (ANTHROPIC_SMART_MODEL:-claude-opus-4-8 vs claude-opus-5).
    volumes:
      - ./.env:/app/.env:ro
      # Structured config (GitLab instances, Telegram channels, model prices) —
      # copy config.example.yaml to config.yaml, then uncomment. Don't mount a
      # missing file: docker would create a directory in its place.
      # - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
      - ./cache:/app/cache
      # Durable state (reviewer.db: job queue, overrides, reviewed SHAs, usage) — NOT swept like cache/
      - ./state:/app/state
      # Repo clone cache for the investigator (size it via REPO_CACHE_MAX_GB)
      - ./repos:/app/repos

    restart: unless-stopped
    # graceful stop: workers get SHUTDOWN_TIMEOUT (20s) to finish a job before
    # it is re-queued in state/reviewer.db; docker's default 10s would kill first
    stop_grace_period: 30s

    networks:
      - gitlab-reviewer-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gitlab-reviewer-network:
    driver: bridge
