services:
  gitlab-mr-reviewer:
    build: .
    ports:
      - "5000:5000"
    environment:
      # GitLab Configuration
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - XGITLABTOKEN=${XGITLABTOKEN}

      # Additional GitLab Instances
      - GITLAB_URL_2=${GITLAB_URL_2:-}
      - GITLAB_TOKEN_2=${GITLAB_TOKEN_2:-}
      - XGITLABTOKEN_2=${XGITLABTOKEN_2:-}

      # AI Provider (Anthropic via Cloudflare AI Gateway + OpenRouter fallback)
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - ANTHROPIC_API_URL=${ANTHROPIC_API_URL:-}
      - ANTHROPIC_API_KEY_GATEWAY=${ANTHROPIC_API_KEY_GATEWAY:-}
      - ANTHROPIC_FAST_MODEL=${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5}
      - ANTHROPIC_MAIN_MODEL=${ANTHROPIC_MAIN_MODEL:-claude-sonnet-5}
      - ANTHROPIC_SMART_MODEL=${ANTHROPIC_SMART_MODEL:-claude-opus-4-8}
      - OPENROUTER_API_TOKEN=${OPENROUTER_API_TOKEN:-}

      # Feature flags (rollout phases)
      - PIPELINE_V2=${PIPELINE_V2:-off}
      - INVESTIGATOR=${INVESTIGATOR:-off}
      - BRIDGE=${BRIDGE:-off}
      - TESTER_REPORT=${TESTER_REPORT:-off}

      # Review Bridge
      - REVIEW_BRIDGE_CHAT_ID=${REVIEW_BRIDGE_CHAT_ID:-}

      # Telegram Configuration
      - TELEGRAM=${TELEGRAM:-off}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_CHAT_ID_2=${TELEGRAM_CHAT_ID_2:-}
      - TELEGRAM_CHAT_ID_3=${TELEGRAM_CHAT_ID_3:-}

      # Proxy Configuration
      - HTTP_PROXY=${HTTP_PROXY:-}
      - SOCKS_PROXY=${SOCKS_PROXY:-}

      # Review Configuration
      - REVIEW_LANGUAGE=${REVIEW_LANGUAGE:-en}
      - REVIEW_FOR_CONFLICT=${REVIEW_FOR_CONFLICT:-false}

      # Debug Configuration (AI_DEBUG intentionally not pinned here so the
      # mounted .env / legacy GEMINI_DEBUG alias can provide it)
      - DEBUG=${DEBUG:-false}

    volumes:
      # Mount .env file if it exists (full config incl. instances 3..10)
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./cache:/app/cache
      # Repo clone cache for the investigator (size it via REPO_CACHE_MAX_GB)
      - ./repos:/app/repos

    restart: unless-stopped

    networks:
      - gitlab-reviewer-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gitlab-reviewer-network:
    driver: bridge
